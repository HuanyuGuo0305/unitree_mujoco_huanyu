# E2 -- Active wheel actuation benchmark. Compares C1 and C2 only.
#
# C1 and C2 were trained with the SAME base-velocity command range, so both
# receive the identical limits, the identical seeds and the identical command
# sequences. The only differences are the model (wheeled vs welded wheels) and
# the action dimension; C2 is never given a wheel velocity action.

experiment: E2
baselines: [C1, C2]
duration_s: 30.0
settle_s: null

# Fixed reachable EE target in the native PLB frame, held all episode.
ee:
  mode: fixed

base:
  # Unchanged in round 3: motion patterns, waveform generation, resampling
  # schedule and task structure are all preserved. ONLY the command amplitude
  # changed.
  segment_duration_range: [2.0, 4.0]
  # ROUND 3: per-axis ABSOLUTE command envelopes, in m/s (vx, vy) and rad/s
  # (yaw rate). Rounds 1-2 used fractions 0.25/0.50/0.75 of the 0.6 shared
  # range, i.e. 0.15/0.30/0.45 -- replaced by 0.20/0.40/0.60 below.
  #
  # These are PER-AXIS absolute limits on the commanded value, NOT a bound on
  # the Euclidean norm of the combined XY velocity: a translate+turn segment
  # may command |vx| = |vy| = the limit simultaneously.
  #
  # High = 0.60 equals baselines.yaml base_command_limits exactly, i.e. the
  # full shared supported training range of C1 and C2. It is never exceeded.
  motion_intensity:
    Low:
      max_abs_vx_mps: 0.20
      max_abs_vy_mps: 0.20
      max_abs_yaw_rate_radps: 0.20
    Medium:
      max_abs_vx_mps: 0.40
      max_abs_vy_mps: 0.40
      max_abs_yaw_rate_radps: 0.40
    High:
      max_abs_vx_mps: 0.60
      max_abs_vy_mps: 0.60
      max_abs_yaw_rate_radps: 0.60
  # Motion-pattern mix. Each seeded episode draws straight, turning and
  # combined segments so that all three appear within every episode; the
  # pattern sequence is identical for C1 and C2 at the same seed.
  pattern_mix: [straight, turn, translate_turn]

conditions:
  Low: {intensity: Low}
  Medium: {intensity: Medium}
  High: {intensity: High}

# Publication table is generated for Medium by default; all three intensities
# are always saved to CSV.
primary_table_condition: Medium

power:
  # P_abs(t) = sum_j |tau_j(t) * qdot_j(t)|, using the ACTUATOR-PRODUCED force
  # d.actuator_force (not the raw policy action, not the un-clipped PD torque)
  # and the physical joint velocity d.qvel, sampled at 250 Hz and averaged over
  # the evaluated window. Mechanical power proxy only -- NOT battery power.
  sample_rate_hz: 250
  groups: [leg, arm, wheel, gripper]

acceleration:
  # Matched physical DOFs only: 12 leg joints and 6 arm joints. Wheels are
  # excluded. No normalisation across the 22 vs 18 action dimensions.
  source: mujoco_qacc        # d.qacc at 250 Hz, unfiltered
  cross_check: finite_difference   # (qvel[t]-qvel[t-1])/dt, same rate, unfiltered
  sample_rate_hz: 250
  filtering: none
