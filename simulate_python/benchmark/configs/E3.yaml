# E3 -- Random discrete full-pose dynamic whole-body coordination.
#
# Protocol: benchmark/results/E3/E3_PROTOCOL.md (committed before the official run).
# 5 base-motion levels x 5 EE command-update intervals x 3 controllers x 100
# paired seeds = 7,500 episodes. Replaces the earlier E3 versions (v1 smooth
# trajectories, v2 arc-length paths, v3 fixed line/circle waypoints).

experiment: E3
protocol: random_full_pose
baselines: [C1, C3, C5]
duration_s: 30.0          # per episode
settle_s: null            # null -> inherit baselines.yaml (3.0)
official_seeds: {start: 0, count: 100}

base:
  # Existing seeded generator (core/scenario.py make_base_velocity_schedule):
  # piecewise-constant segments of U(2, 4) s, each axis U(-1, 1) times the level.
  # Stream label "base_velocity"; independent of the EE pose stream.
  levels: [0.00, 0.15, 0.30, 0.45, 0.60]   # |vx|,|vy| <= B m/s, |wz| <= B rad/s (body frame)
  segment_duration_range: [2.0, 4.0]

ee:
  # Targets: rows of the native training table (utilities/data/
  # keypoints_plb_evaluation_filtered.npy, sha256 d822f110...c328; the same
  # file every controller was trained on), drawn uniformly with replacement as in
  # training (PresampledKeypointsDirectCommandPLB: torch.randint, no weights).
  # Stream label "e3_random_pose". Direct sample-and-hold, no interpolation.
  update_intervals_s: [null, 6.0, 4.0, 3.0, 2.0]   # null = Fixed (pose 0 held)
  level_labels: [Fixed, 6s, 4s, 3s, 2s]
  feasible_rows_file: E3_feasible_rows.npy        # validity screen output (all 20,000 rows)
  feasible_rows_sha256: d7887b8802aca65a039582c74ba00a73fd53b9b49eacc002157b79b418e34a80
  settle_hold: first_target                         # pose 0 commanded during settling
