# E4 -- World-frame EE stabilisation ("chicken head").
#
# Demonstrates that the unified whole-body policy produces a reusable
# coordinated behaviour from direct commands, with no task-specific retraining.
# Main controller C1; C3 and C5 may be added for context.

experiment: E4
baselines: [C1]
optional_baselines: [C3, C5]
duration_s: 30.0
# E4 uses a longer settling window than the other experiments: the arm is first
# commanded onto the PLB setpoint below and must converge there BEFORE the
# world-frame target is locked, otherwise the locked target inherits the
# startup transient.
settle_s: 5.0

ee:
  # During settling the arm is commanded to this PLB pose (the nearest native
  # command-table row to `plb_center`), which puts the EE in the middle of the
  # reachable region with headroom in every direction. The world-frame target
  # is then locked to the MEASURED EE pose at the first evaluated tick, so it
  # is reachable by construction and identically defined for every baseline.
  world_target: from_plb_setpoint
  plb_center: [0.60, 0.00, 0.75]
  support_tolerance: 0.12
  # At each control update the fixed world target is transformed into the
  # native PLB command frame using the CURRENT MEASURED base pose. This is a
  # command-frame transformation at the same injection point every other
  # experiment uses: no external EE stabilisation controller, no change to the
  # policy output or the actuation pipeline.
  transform: world_to_plb_per_tick

base:
  # Bounded, deterministic base motion. Each phase commands a COSINE velocity,
  # so the base POSITION oscillates symmetrically about its starting point with
  # amplitude  amplitude * limit * phase_duration / (2*pi)  and returns there
  # at the end of every period. With amplitude 0.5, limit 0.6 m/s and a 4 s
  # phase that is +-0.19 m of translation and +-0.19 rad of yaw, which keeps
  # the fixed world-frame EE target inside the reachable PLB region for the
  # whole episode (verified per tick, see target_outside_support_fraction).
  schedule: chicken_head
  amplitude: 0.5                 # fraction of base_command_limits
  phase_duration_s: 4.0
  phases: [forward_back, lateral, yaw, combined, forward_back, hold]

outputs:
  snapshots: true
  snapshot_times_s: [5.0, 9.0, 13.0, 17.0, 21.0, 25.0]
  video: false                   # enable with --video (needs an EGL/OSMesa GL backend)
