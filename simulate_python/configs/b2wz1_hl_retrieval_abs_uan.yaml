# B2WZ1 hierarchical retrieval sim2sim with frozen WBC + frozen UAN.
# ABS high-level EE action; actor grasp-confidence proxy REMOVED.
#
# Run from unitree_mujoco/simulate_python:
#
#   python3 deploy_mujoco/b2wz1_hl_retrieval_abs_uan.py \
#       configs/b2wz1_hl_retrieval_abs_uan.yaml
#
# Hierarchy:
#   MuJoCo/UAN physics = 250 Hz
#   frozen WBC         =  50 Hz
#   high-level policy  =  10 Hz
#
# Actor interface change only:
#   old: 56-D/frame x 3 feature-major = 168-D
#   new: 55-D/frame x 3 feature-major = 165-D
# grasp_confidence_proxy is NOT fed to the actor.
# The proxy is still computed internally for the unchanged force-close/task logic.

# Frozen WBC trained with UAN.
low_policy_path: "exported_policy/b2wz1_hl_retrieval_abs_uan/low_policy.onnx"

# Newly trained ABS high-level retrieval policy WITHOUT actor grasp proxy.
# Point this at the new exported ONNX; its input must be [1, 165].
high_policy_path: "exported_policy/b2wz1_hl_retrieval_abs_uan/high_policy_5.onnx"

# Frozen model_4000 deterministic TorchScript UAN, including actor normalizer.
uan_model_path: "exported_policy/b2wz1_hl_retrieval_uan/model_4000_inference.pt"

xml_path: "unitree_robots/b2wz1/b2wz1_retrieval.xml"

simulation_duration: 180.0
simulation_dt: 0.004

# 250 Hz / 5 = 50 Hz frozen WBC.
ll_control_decimation: 5
# 50 Hz / 5 = 10 Hz high level.
ll_steps_per_hl_step: 5

# ---------------- Low-level policy interface ----------------
ll_history_length: 5
ll_obs_dim_per_step: 80
ll_obs_dim: 400
ll_action_dim: 22

# ---------------- High-level policy interface ----------------
# 55-D/frame, 3-frame feature-major history => 165-D.
hl_history_length: 3
hl_obs_dim_per_step: 55
hl_obs_dim: 165
hl_action_dim: 9

# ---------------- Robot reset / actuation ----------------
root_pos: [0.0, 0.0, 0.6017]
root_quat_wxyz: [1.0, 0.0, 0.0, 0.0]

# MuJoCo qpos order:
# FL leg+wheel, FR leg+wheel, RL leg+wheel, RR leg+wheel,
# joint1..joint6, jointGripper.
default_joint_pos: [
  0.1, 0.8, -1.5, 0.0,
 -0.1, 0.8, -1.5, 0.0,
  0.1, 1.0, -1.5, 0.0,
 -0.1, 1.0, -1.5, 0.0,
  0.0, 1.48, -1.0, -0.54, 0.0, 1.57, 0.0
]

# Legs and gripper use these tables directly.
# Arm entries are aligned with the UAN nominal PD for readability, but the
# six arm torques are generated by the explicit UAN block below.
kps: [
  200.0, 200.0, 300.0, 0.0,
  200.0, 200.0, 300.0, 0.0,
  200.0, 200.0, 300.0, 0.0,
  200.0, 200.0, 300.0, 0.0,
  64.0, 115.2, 64.0, 64.0, 64.0, 64.0, 76.8
]

kds: [
  8.0, 8.0, 12.0, 10.0,
  8.0, 8.0, 12.0, 10.0,
  8.0, 8.0, 12.0, 10.0,
  8.0, 8.0, 12.0, 10.0,
  3.0, 4.0, 3.0, 3.0, 3.0, 3.0, 4.0
]

leg_action_scale: 0.25
arm_action_scale: [0.10, 0.10, 0.10, 0.10, 0.10, 0.10]
wheel_action_scale: 4.0

leg_torque_limits: [
  200.0, 200.0, 320.0,
  200.0, 200.0, 320.0,
  200.0, 200.0, 320.0,
  200.0, 200.0, 320.0
]

wheel_velocity_limits: [50.0, 50.0, 50.0, 50.0]

# ---------------- Frozen UAN actuator ----------------
uan_device: "cpu"
uan_history_length: 25
uan_pos_scale: 1.0
uan_vel_scale: 0.05
uan_action_scale: 0.20

uan_kp: [64.0, 115.2, 64.0, 64.0, 64.0, 64.0]
uan_kd: [3.0, 4.0, 3.0, 3.0, 3.0, 3.0]

# First clamp: nominal position-PD torque.
uan_nominal_torque_limits: [30.0, 60.0, 30.0, 30.0, 30.0, 30.0]

# Second/final clamp after adding UAN residual.
uan_final_torque_limits: [45.0, 90.0, 45.0, 45.0, 45.0, 45.0]

uan_action_saturation_threshold: 0.95

# b2wz1_retrieval.xml may still contain the legacy +/-30/60 Nm arm limits.
# Synchronize redundant MuJoCo actuator/joint ranges to the UAN final envelope.
sync_mujoco_arm_limits_to_uan: true

# ---------------- Gripper ----------------
gripper_open_pos: -1.57
gripper_close_pos: -0.53
gripper_binary_threshold: 0.0

# jointGripper actuator model (never UAN):
#   "dc_motor"    -> IsaacLab DCMotor.  Ideal-PD effort clipped by the linear
#                    four-quadrant torque-speed envelope.  This is what the
#                    policy was trained with.
#   "pd_position" -> ideal PD position actuator.  tau = kp*(q_des-q) - kd*qdot,
#                    clipped only to +/- gripper_pd_torque_limit, with no
#                    torque-speed envelope and no velocity pre-clip.
gripper_mode: "pd_position"

# dc_motor parameters.
gripper_torque_limit: 30.0
gripper_saturation_effort: 30.0
gripper_velocity_limit: 2.0

# pd_position parameters, read only when gripper_mode == "pd_position".
# gripper_pd_kp / gripper_pd_kd default to the jointGripper entries of the
# kps/kds tables above; gripper_pd_torque_limit defaults to gripper_torque_limit.
# Keep the effort limit within the MuJoCo motorGripper ctrlrange (+/-30 Nm in
# b2wz1.xml) or MuJoCo clamps it; the script warns at startup if it does.
gripper_pd_kp: 64.0
gripper_pd_kd: 10.0
gripper_pd_torque_limit: 30.0

# Deployment version of the training Stage-2 heuristic.
stage2_force_gripper_close_enabled: false

# IMPORTANT: this proxy is retained internally, but is NOT an actor obs term.
gripper_center_offset_local: [0.075, 0.0, 0.01]
grasp_proxy_error_threshold: 0.10
gripper_not_fully_closed_angle_threshold: -0.08726646259971647
gripper_angle_hold_threshold: 0.05235987755982989
grasp_proxy_enter_steps: 3
grasp_proxy_exit_steps: 3

# ---------------- PLB / EE command ----------------
ee_body: "gripperStator"
ground_z: 0.0
ee_kp_dx: 0.30
ee_kp_dz: 0.30

neutral_kp0: [0.55, 0.0, 1.12]
neutral_ee_yaw: 0.0
neutral_ee_pitch: -0.06
fixed_ee_roll: 1.5707963267948966

base_cmd_scale: [0.5, 0.5, 0.5]

# ABS high-level EE action ranges.
kp0_x_range: [0.40, 0.90]
kp0_y_range: [-0.30, 0.30]
kp0_z_range: [0.0, 1.15]
ee_yaw_range: [-1.0471975511965976, 1.0471975511965976]
ee_pitch_range: [-1.2217304763960306, 0.0]

# Z1 EE-frame convention fix validated in sim2sim:
# negative policy pitch must tilt gripper local +X toward the ground.
# Standard XYZ Euler pitch has the opposite sign for this geometry.
ee_pitch_to_euler_sign: -1.0

# ---------------- Retrieval task reset distribution ----------------
random_seed: 0
episode_length_s: 15.0
auto_reset: true

cube_body: "retrieval_cube"
cube_freejoint: "retrieval_cube_freejoint"
cube_side: 0.050
object_half_extent: 0.025
object_spawn_z_epsilon: 0.001
object_sampling_center_x: 0.8
object_sampling_center_y: 0.0
object_sampling_r_range: [0.0, 2.0]
object_sampling_theta_max: 0.7853981633974483

enlarged_retrieval_target_sampling_range: true

retrieval_target_radius: 0.25
retrieval_target_z_w: 0.50

enlarged_retrieval_target_radius: 0.50
enlarged_retrieval_target_z_range_w: [0.30, 0.80]

# ---------------- Visualization / diagnostics ----------------
vis_retrieval_target: true
vis_retrieval_target_radius: 0.05
vis_ee_target: true
vis_ee_target_axis_len: 0.20
vis_ee_target_axis_radius: 0.01
vis_ee_target_sphere_size: 0.03

vis_grasp_debug: true
vis_gripper_center_radius: 0.018
vis_cube_center_radius: 0.015

print_interval_sim_steps: 200

# Tracking diagnostics are unchanged.
debug_tracking_logging: false
debug_tracking_log_every_ll_steps: 1
debug_tracking_csv_path: "logs/b2wz1_hl_retrieval_abs_uan_tracking_debug.csv"