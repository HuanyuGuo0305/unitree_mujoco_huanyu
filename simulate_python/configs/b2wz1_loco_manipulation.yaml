policy_path: "exported_policy/b2wz1_loco_manipulation/policy_H5.onnx"
xml_path: "unitree_robots/b2wz1/ground.xml"
kp_table_path: "utilities/tools/reachable_kp0kp1kp2_lb.npy"  # (N,9) in Level Base Frame

# Simulation
simulation_duration: 60.0
simulation_dt: 0.005
control_decimation: 4
render: true

# Policy IO
history_length: 5
obs_dim_per_step: 89
obs_dim: 445
action_dim: 22  # 12 leg + 6 arm + 4 wheel (in this order)

# Base velocity command in policy obs
base_command: [0.0, 0.0, 0.0]  # [vx, vy, wz]

# EE keypoints command sampling (match training)
ee_cmd_resampling_time_s: 1000.0
kp_dx: 0.30
kp_dz: 0.30
kp0_threshold: 0.20
rot_threshold: 0.40

# Init root pose
root_pos: [0.0, 0.0, 0.6017]
root_quat_wxyz: [1.0, 0.0, 0.0, 0.0]

# Default joint positions - MuJoCo order
# FL (hip thigh calf wheel), FR, RL, RR, then arm joint1..6 + jointGripper
default_joint_pos: [
  0.1,  0.8, -1.5, 0.0,
 -0.1,  0.8, -1.5, 0.0,
  0.1,  1.0, -1.5, 0.0,
 -0.1,  1.0, -1.5, 0.0,
  0.0,  1.48, -1.0, -0.54, 0.0, 0.0, 
  0.0
]

# Action scaling (match training)
leg_action_scale: 0.25
arm_action_scale: 0.75
wheel_action_scale: 5.0

# PD gains (match IsaacLab actuators)
leg_kps: [320,320,320, 320,320,320, 320,320,320, 320,320,320]
leg_kds: [10,10,10,    10,10,10,    10,10,10,    10,10,10]
arm_kps: [50,50,50,50,50,50]
arm_kds: [8,8,8,8,8,8]

# Limits (match XML ctrlrange/forcerange)
leg_torque_limits: [200.0, 200.0, 320.0]  # hip, thigh, calf
arm_torque_limit: 30.0
wheel_vel_limit: 50.0

# Sites
ee_site: "z1_ee"