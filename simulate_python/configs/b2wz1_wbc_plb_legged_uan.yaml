# C2 - mechanically locked-wheel B2W+Z1 WBC-UAN MuJoCo Sim2Sim.
# Derived from the user-provided, working C1 YAML and C2 Isaac Lab env config.
# C2 ONNX filename is policy_1.onnx as provided by the user; verify it exists.
# Export the C2 checkpoint with its trained actor observation normalizer.
policy_path: "exported_policy/b2wz1_wbc_plb_legged_uan/policy_1.onnx"  # exported C2 policy
uan_model_path: "exported_policy/b2wz1_wbc_plb_uan/model_4000_inference.pt"
# C2 stand-alone fixed-wheel model generated from the supplied C1 b2wz1.xml.
xml_path: "unitree_robots/b2wz1/b2wz1_legged.xml"

simulation_duration: 180.0
simulation_dt: 0.004
control_decimation: 5
startup_hold_s: 1.0
startup_blend_s: 2.0

history_length: 5
obs_dim_per_step: 72
obs_dim: 360
action_dim: 18
base_command: [0.5, 0.0, 0.0]
root_pos: [0.0, 0.0, 0.6017]
root_quat_wxyz: [1.0, 0.0, 0.0, 0.0]

# YAML arrays are indexed by these EXPLICIT joint names, NOT by d.qpos order.
# Model is 12 legs + 6 arm + 1 gripper = 19 joints, 0 wheel DOFs.
config_joint_names:
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint
  - joint1
  - joint2
  - joint3
  - joint4
  - joint5
  - joint6
  - jointGripper

default_joint_pos:
  - 0.1
  - 0.8
  - -1.5
  - -0.1
  - 0.8
  - -1.5
  - 0.1
  - 1.0
  - -1.5
  - -0.1
  - 1.0
  - -1.5
  - 0.0
  - 1.48
  - -1.0
  - -0.54
  - 0.0
  - 1.57
  - 0.0

# Leg+gripper PD: same numerical gains as C1. Arm torque handled by UAN block.
kps: [200.0, 200.0, 300.0, 200.0, 200.0, 300.0, 200.0, 200.0, 300.0, 200.0, 200.0, 300.0, 64.0, 115.2, 64.0, 64.0, 64.0, 64.0, 64.0]
kds: [8.0, 8.0, 12.0, 8.0, 8.0, 12.0, 8.0, 8.0, 12.0, 8.0, 8.0, 12.0, 3.0, 4.0, 3.0, 3.0, 3.0, 3.0, 3.0]

leg_action_scale: 0.25
arm_action_scale: [0.10, 0.10, 0.10, 0.10, 0.10, 0.10]

# IMPORTANT: order here is the actual policy leg order (hips[4], thighs[4], calves[4]),
# NOT C1's original YAML per-leg ordering. Calf limit 320 Nm, hip/thigh 200 Nm.
leg_torque_limits: [200.0, 200.0, 200.0, 200.0, 200.0, 200.0, 200.0, 200.0, 320.0, 320.0, 320.0, 320.0]
gripper_torque_limit: 30.0

# Arm UAN matches C1 / UNITREE_B2WZ1_LEGGED_UAN_CFG.
uan_device: "cpu"
uan_history_length: 25
uan_pos_scale: 1.0
uan_vel_scale: 0.05
uan_action_scale: 0.20
uan_kp: [64.0, 115.2, 64.0, 64.0, 64.0, 64.0]
uan_kd: [3.0, 4.0, 3.0, 3.0, 3.0, 3.0]
uan_nominal_torque_limits: [30.0, 60.0, 30.0, 30.0, 30.0, 30.0]
uan_final_torque_limits: [45.0, 90.0, 45.0, 45.0, 45.0, 45.0]
uan_action_saturation_threshold: 0.95
sync_mujoco_arm_limits_to_uan: true

ee_body: "gripperStator"
ee_command_mode: "direct"
ee_command_path: "utilities/data/keypoints_plb_evaluation_filtered.npy"
ee_ground_z: 0.0
ee_kp_dx: 0.30
ee_kp_dz: 0.30
ee_command_seed: 0
ee_cycle_duration_s: 8.0
ee_sequential_traj_duration_s: 2.0
ee_sequential_hold_duration_s: 1.0

vis_ee_target: true
vis_ee_target_axis_len: 0.20
vis_ee_target_axis_radius: 0.01
vis_ee_target_sphere_size: 0.03
vis_ee_target_alpha: 0.9
vis_ee_target_show_current: true
