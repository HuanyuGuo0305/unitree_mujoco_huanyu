# E5 -- Dynamic object retrieval benchmark (MuJoCo sim2sim of the Isaac Lab
# B2WZ1HLRetrievalUANABSEnv task).
#
# Robot / frozen WBC / UAN / HL-interface constants come from the aligned
# deployment YAML (single source of truth for the control path). Everything
# specific to the size-wise evaluation is defined here. Every task constant
# below was transcribed from the training run's params/env.yaml and is
# re-checked against that file by tests/test_alignment.py when it is available.
# Paths are relative to unitree_mujoco/.

